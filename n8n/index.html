<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get the n8n Integration Checklist — 25 production checks, the 5 integrations that trip everyone up, and free workflow JSON downloads.">
  <title>n8n Integration Checklist — Occelatus Research</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=IBM+Plex+Sans:wght@300;400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0: #0b0e17;
      --bg-1: #11141f;
      --bg-2: #181c2a;
      --line: rgba(255,255,255,0.06);
      --line-strong: rgba(255,255,255,0.12);
      --text: #e6e8ef;
      --text-muted: #8b91a8;
      --text-dim: #5a6079;
      --accent: #7df9ff;
      --accent-soft: rgba(125,249,255,0.12);
      --radius: 14px;
      --radius-sm: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-0);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .wordmark {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      text-transform: uppercase;
      text-decoration: none;
      display: block;
      margin-bottom: 48px;
    }
    .wordmark span { color: var(--accent); }

    .card {
      width: 100%;
      max-width: 600px;
      background: linear-gradient(180deg, #13172480 0%, #0c0e1a80 100%);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      padding: 48px 40px;
    }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(26px, 5vw, 36px);
      font-weight: 500;
      line-height: 1.2;
      margin-bottom: 28px;
    }

    .bullets {
      list-style: none;
      margin-bottom: 36px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bullets li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 15px;
      color: var(--text-muted);
    }

    .bullets li::before {
      content: '→';
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--line);
      margin-bottom: 32px;
    }

    .form-wrap {
      display: flex;
      justify-content: center;
    }

    iframe {
      display: block;
      max-width: 100%;
      border: none;
      background: transparent;
    }

    @media (max-width: 520px) {
      .card { padding: 32px 20px; }
    }
  </style>
</head>
<body>

  <a class="wordmark" href="https://occelatus.io">OCCELATUS<span>.</span>IO</a>

  <div class="card">
    <div class="eyebrow">Free resource</div>
    <h1>Get the n8n Integration Checklist</h1>

    <ul class="bullets">
      <li>25 production checks before you go live</li>
      <li>The 5 integrations that trip everyone up</li>
      <li>Free workflow JSON downloads</li>
    </ul>

    <hr class="divider">

    <div class="form-wrap">
      <iframe
        width="540"
        height="305"
        src="https://174f132b.sibforms.com/v2/serve/MUIFANGd9Lkcp4tL_cwjV4w5rrudcRdauMTOmN-qzY02Ce3-l-8UuaEGSlARM0bl9nzHZApYDRRhI02x6mtdgGJGcVPtRz6zaDXXzLDD7mWtcatP9JejO86ZJ98T_teFHbpMSL4BR6MzHzEGO_BAlJZg7qBsZDq_3a3jG33qd4EZ4DCDAIhEhYK0ttirmLbejpz0kuViyY0uzYEctg=="
        scrolling="auto"
        allowfullscreen
        style="max-width:100%;"
      ></iframe>
    </div>
  </div>

</body>
</html>
